name: m2-swarm

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    ports: ["${PG_PORT:-5432}:5432"]  # set PG_PORT if 5432 is taken locally
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm"]
      interval: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/swarm-neo4j
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: [./backend/.env]
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://swarm:swarm@postgres:5432/swarm
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      OLLAMA_URL: http://host.docker.internal:11434  # Ollama runs on the host
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    volumes: [storage:/data/storage]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: [./backend/.env]
    environment: *backend_env
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [storage:/data/storage]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
  neo4jdata:
  storage:
