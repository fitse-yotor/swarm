[project]
name = "m2-swarm-backend"
version = "0.1.0"
description = "M2 Swarm — case intelligence, knowledge graph and simulation platform (API + workers), local models only"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "neo4j>=5.26",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "httpx>=0.28",
  "spacy>=3.8,<3.9",
  "networkx>=3.4",
  "rapidfuzz>=3.10",
  "pypdf>=5.1",
  "fastembed>=0.4",
]

[project.optional-dependencies]
# Docling pulls in torch and layout models; it is installed in the worker image
# and is the primary PDF/Markdown parser. Without it, PDFs fall back to pypdf.
docling = ["docling>=2.15"]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "reportlab>=4.2"]  # reportlab: cases/build_case_pdfs.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
