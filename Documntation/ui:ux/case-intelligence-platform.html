<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lattice — Case Intelligence & Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1020;--side:#0F172A;--surf:#151E30;--elev:#1D2940;--acc:#4F8CFF;--acc-soft:rgba(79,140,255,.14);
  --tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;--bd:#29364B;--bd2:#1E2A3D;
  --ok:#34D399;--warn:#FBBF24;--err:#FB7185;--ok-s:rgba(52,211,153,.13);--warn-s:rgba(251,191,36,.13);--err-s:rgba(251,113,133,.13);
  --person:#60A5FA;--organization:#A78BFA;--country:#FBBF24;--location:#34D399;--event:#FB7185;--policy:#22D3EE;--topic:#F472B6;--document:#94A3B8;
  --ui:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r1:4px;--r2:6px;--r3:10px;
  --t:180ms cubic-bezier(.2,.7,.2,1);
  --canvas:#0A0F1D;--overlay:rgba(4,8,18,.6);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F3F5F9;--side:#E9EDF4;--surf:#FFFFFF;--elev:#F6F8FB;--acc:#2563EB;--acc-soft:rgba(37,99,235,.10);
  --tx:#0F172A;--tx2:#475569;--tx3:#7A8699;--bd:#D5DCE6;--bd2:#E5EAF1;
  --ok:#059669;--warn:#B45309;--err:#E11D48;--ok-s:rgba(5,150,105,.10);--warn-s:rgba(180,83,9,.10);--err-s:rgba(225,29,72,.09);
  --person:#2563EB;--organization:#7C3AED;--country:#B45309;--location:#059669;--event:#E11D48;--policy:#0891B2;--topic:#DB2777;--document:#64748B;
  --canvas:#FAFBFD;--overlay:rgba(15,23,42,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px;line-height:1.2}
h2{font-size:17px}
h3{font-size:14.5px}
h4{font-size:13px;color:var(--tx2);font-weight:500}
p{margin:0}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}.small{font-size:12.5px}.xs{font-size:11.5px}
.mono{font-family:var(--mono);font-size:12px}
.serif{font-family:var(--serif)}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:8px}
.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.gap4{gap:4px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.hide{display:none!important}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;height:100vh;transition:grid-template-columns var(--t)}
.shell.collapsed{grid-template-columns:60px 1fr}
.side{background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;height:56px}
.brand-mark{width:28px;height:28px;flex:none}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--tx3)}
.ws{margin:0 10px 8px;display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--bd);border-radius:var(--r2);background:transparent;cursor:pointer;width:calc(100% - 20px);text-align:left}
.ws:hover{background:var(--elev)}
.ws-dot{width:18px;height:18px;border-radius:4px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.nav{padding:6px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1}
.nav-sec{font-size:11px;color:var(--tx3);padding:12px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--r2);color:var(--tx2);font-weight:500;font-size:13.5px;position:relative;white-space:nowrap}
.nav a:hover{background:var(--elev);color:var(--tx)}
.nav a.on{background:var(--acc-soft);color:var(--tx)}
.nav a.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--acc)}
.nav svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-size:11px;color:var(--tx3)}
.side-foot{border-top:1px solid var(--bd);padding:8px}
.me{display:flex;align-items:center;gap:9px;padding:6px;border-radius:var(--r2)}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.side-tools{display:flex;gap:2px;margin-top:4px}
.collapsed .brand-text,.collapsed .ws-text,.collapsed .nav-sec,.collapsed .nav a span,.collapsed .nav .count,.collapsed .me-text{display:none}
.collapsed .side-tools{flex-direction:column}
.collapsed .ws{justify-content:center;padding:7px 0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--bd);background:var(--bg);flex:none;position:relative;z-index:20}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);min-width:0}
.crumbs b{color:var(--tx);font-weight:600}
.crumbs .sep{color:var(--tx3)}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;height:34px;padding:0 10px 0 32px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2)}
.search>svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--tx3)}
.search kbd{position:absolute;right:8px;top:8px;font:11px var(--ui);color:var(--tx3);border:1px solid var(--bd);border-radius:3px;padding:0 4px}
.drop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r3);box-shadow:0 16px 40px rgba(0,0,0,.35);min-width:320px;max-height:420px;overflow:auto;z-index:60;padding:6px}
.drop-item{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:var(--r2);cursor:pointer;width:100%;background:none;border:0;text-align:left}
.drop-item:hover,.drop-item.kb{background:var(--elev)}
.view{flex:1;min-height:0;overflow:auto}
.page{padding:22px 26px 40px;max-width:1440px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head p{color:var(--tx2);margin-top:4px;max-width:70ch}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--bd);background:var(--surf);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:background var(--t),border-color var(--t),transform 90ms}
.btn:hover{background:var(--elev)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--elev)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--bd))}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--bd))}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm.icon{width:26px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{height:40px;padding:0 18px;font-size:14px}
.inp,.sel,textarea.inp{width:100%;height:34px;padding:0 10px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r2);transition:border-color var(--t)}
[data-theme="light"] .inp,[data-theme="light"] .sel{background:#fff}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;min-height:72px;line-height:1.45}
.inp:focus,.sel:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
.inp.bad{border-color:var(--err)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:12.5px;color:var(--tx2);font-weight:500}
.field .hint{font-size:11.5px;color:var(--tx3)}
.field .errt{font-size:11.5px;color:var(--err)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.chk input{accent-color:var(--acc);width:15px;height:15px}
input[type=range]{accent-color:var(--acc);width:100%}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:var(--r2);padding:2px;background:var(--bg);gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12.5px;color:var(--tx2)}
.seg button.on{background:var(--elev);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 12px;color:var(--tx2);cursor:pointer;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--tx);border-color:var(--acc)}
.tabs button:hover{color:var(--tx)}

/* ---------- surfaces ---------- */
.panel{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r3)}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd2)}
.panel-b{padding:14px}
.panel-h h3{font-size:13.5px}
.sec{padding:12px 14px;border-bottom:1px solid var(--bd2)}
.sec:last-child{border-bottom:0}
.sec-t{font-size:12px;color:var(--tx2);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--tx3)}.kv dd{margin:0}

/* metric strip — one bar, not cards */
.strip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));background:var(--surf);border:1px solid var(--bd);border-radius:var(--r3);overflow:hidden}
.strip>div{padding:12px 14px;border-right:1px solid var(--bd2)}
.strip>div:last-child{border-right:0}
.strip .v{font-size:20px;font-weight:600;letter-spacing:-.02em}
.strip .l{font-size:11.5px;color:var(--tx2);margin-top:2px;line-height:1.25}
.strip .d{font-size:11px;color:var(--tx3);margin-top:3px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--tx3);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:0;background:var(--surf);z-index:1}
.tbl th.sortable{cursor:pointer}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--bd2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background var(--t)}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--elev) 60%,transparent)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.b-ok{color:var(--ok);background:var(--ok-s);border-color:transparent}
.b-warn{color:var(--warn);background:var(--warn-s);border-color:transparent}
.b-err{color:var(--err);background:var(--err-s);border-color:transparent}
.b-acc{color:var(--acc);background:var(--acc-soft);border-color:transparent}
.b-syn{color:var(--acc);border:1px dashed color-mix(in srgb,var(--acc) 60%,transparent);background:transparent}
.etype{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.etype svg{width:12px;height:12px;flex:none}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:var(--elev);font-size:11.5px;color:var(--tx2)}

/* provenance marks: the visual vocabulary for evidence vs simulation vs interpretation */
.prov{position:relative;padding:8px 12px 8px 14px;border-radius:0 var(--r2) var(--r2) 0;margin:8px 0}
.prov::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.prov.fact{background:var(--ok-s)}.prov.fact::before{background:var(--ok)}
.prov.sim{background:var(--acc-soft)}.prov.sim::before{background:repeating-linear-gradient(var(--acc) 0 6px,transparent 6px 10px)}
.prov.interp{background:var(--warn-s)}.prov.interp::before{background:repeating-linear-gradient(var(--warn) 0 2px,transparent 2px 5px)}
.prov-tag{font:600 11px var(--ui);display:inline-flex;align-items:center;gap:5px;margin-bottom:3px}
.prov.fact .prov-tag{color:var(--ok)}.prov.sim .prov-tag{color:var(--acc)}.prov.interp .prov-tag{color:var(--warn)}
.cite{display:inline-flex;align-items:center;height:17px;padding:0 5px;margin:0 2px;border-radius:3px;font:600 10.5px var(--ui);background:var(--elev);color:var(--acc);border:1px solid var(--bd);cursor:pointer;vertical-align:1px}
.cite:hover{border-color:var(--acc)}
.quote{font-family:var(--serif);font-size:14.5px;line-height:1.6;color:var(--tx)}
mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.demo-flag{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px dashed color-mix(in srgb,var(--warn) 55%,transparent);border-radius:var(--r2);color:var(--warn);font-size:12.5px;background:var(--warn-s)}
.demo-flag svg{width:16px;height:16px;flex:none}
.syn-flag{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px dashed color-mix(in srgb,var(--acc) 60%,transparent);border-radius:var(--r2);color:var(--acc);font-size:12.5px;background:var(--acc-soft)}
.syn-flag svg{width:16px;height:16px;flex:none}

/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px}
.stages{display:grid;grid-template-columns:200px repeat(5,1fr);font-size:12.5px}
.stages .hd{color:var(--tx3);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--bd2)}
.stages .cn{padding:10px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:6px;min-width:0}
.stages .st{padding:10px 8px;border-bottom:1px solid var(--bd2);display:flex;align-items:center}
.stbar{height:6px;border-radius:3px;width:100%;background:var(--elev);position:relative;overflow:hidden}
.stbar>i{position:absolute;inset:0;border-radius:3px}
.st.done .stbar>i{background:var(--ok)}
.st.cur .stbar>i{background:repeating-linear-gradient(-45deg,var(--acc) 0 6px,color-mix(in srgb,var(--acc) 60%,transparent) 6px 12px);right:45%}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:8px 0;position:relative}
.timeline li::before{content:"";position:absolute;left:10px;top:28px;bottom:-8px;width:1px;background:var(--bd)}
.timeline li:last-child::before{display:none}
.tl-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--elev);border:1px solid var(--bd)}
.tl-ic svg{width:12px;height:12px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border:1px solid var(--bd);background:var(--bg);border-radius:var(--r2);cursor:pointer;text-align:left}
.qa button:hover{border-color:var(--acc)}
.qa svg{width:17px;height:17px;color:var(--acc)}

/* wizard */
.stepper{display:flex;gap:0;margin-bottom:20px;counter-reset:s;overflow-x:auto}
.stepper .s{flex:1;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 0;font-size:13px;color:var(--tx3);border-top:2px solid var(--bd);min-width:120px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.stepper .s b{width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:11px;flex:none}
.stepper .s.on{color:var(--tx);border-top-color:var(--acc)}
.stepper .s.on b{background:var(--acc);border-color:var(--acc);color:#fff}
.stepper .s.done{color:var(--tx2);border-top-color:var(--ok)}
.stepper .s.done b{background:var(--ok-s);border-color:var(--ok);color:var(--ok)}
.dz{border:1.5px dashed var(--bd);border-radius:var(--r3);padding:34px;text-align:center;transition:border-color var(--t),background var(--t);cursor:pointer;background:var(--bg)}
.dz:hover,.dz.over{border-color:var(--acc);background:var(--acc-soft)}
.dz svg{width:28px;height:28px;color:var(--tx3)}
.prog{height:4px;background:var(--elev);border-radius:2px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--acc);transition:width 300ms}
.prog.ok>i{background:var(--ok)}.prog.err>i{background:var(--err)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick label{display:flex;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:var(--r2);cursor:pointer;align-items:flex-start;background:var(--bg)}
.pick label:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.pick input{margin-top:2px;accent-color:var(--acc)}

/* build */
.stagelist{list-style:none;margin:0;padding:0}
.stagelist li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd2);font-size:13.5px}
.stagelist li:last-child{border-bottom:0}
.sdot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;flex:none}
.sdot svg{width:12px;height:12px}
.done .sdot{background:var(--ok);border-color:var(--ok);color:#0B1020}
.run .sdot{border-color:var(--acc);border-top-color:transparent;animation:spin .8s linear infinite}
.fail .sdot{background:var(--err);border-color:var(--err);color:#fff}
.pend{color:var(--tx3)}
@keyframes spin{to{transform:rotate(360deg)}}
.logbox{font-family:var(--mono);font-size:11.5px;line-height:1.6;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r2);padding:10px;height:220px;overflow:auto;color:var(--tx2)}
.logbox .e{color:var(--err)}.logbox .o{color:var(--ok)}

/* ---------- graph explorer ---------- */
.gx{display:grid;grid-template-columns:268px minmax(0,1fr) 340px;height:100%;min-height:0}
.gx-left,.gx-right{background:var(--surf);overflow-y:auto;min-height:0}
.gx-left{border-right:1px solid var(--bd)}
.gx-right{border-left:1px solid var(--bd)}
.gx-center{position:relative;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
.gx-center canvas{display:block;width:100%;height:100%;touch-action:none}
.gx-center.full{position:fixed;inset:0;z-index:80}
.gx-toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:3}
.gx-toolbar>*{pointer-events:auto}
.tb{display:flex;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2);padding:2px;gap:1px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.tb button{width:30px;height:28px;border:0;background:none;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:var(--tx2)}
.tb button:hover{background:var(--elev);color:var(--tx)}
.tb button.on{background:var(--acc-soft);color:var(--acc)}
.tb button svg{width:15px;height:15px}
.tb select{border:0;background:none;padding:0 6px;height:28px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.ver-chip{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2);padding:3px 4px 3px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.ver-chip.locked{border-color:color-mix(in srgb,var(--ok) 50%,var(--bd))}
.gx-legend{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--surf) 92%,transparent);border:1px solid var(--bd);border-radius:var(--r2);padding:8px 10px;font-size:11.5px;display:grid;grid-template-columns:repeat(4,auto);gap:4px 14px;z-index:3}
.gx-legend .lg{display:flex;align-items:center;gap:6px;color:var(--tx2);cursor:pointer;background:none;border:0;padding:0;font-size:11.5px}
.gx-legend .lg.off{opacity:.35}
.gx-legend .lines{grid-column:1/-1;display:flex;gap:14px;border-top:1px solid var(--bd2);padding-top:6px;margin-top:2px;color:var(--tx3)}
.gx-legend .lines span{display:flex;align-items:center;gap:6px}
.gx-stats{position:absolute;right:12px;top:52px;font-size:11.5px;color:var(--tx3);background:color-mix(in srgb,var(--surf) 85%,transparent);padding:4px 8px;border-radius:4px;border:1px solid var(--bd2);z-index:3}
.gx-tip{position:absolute;pointer-events:none;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2);padding:8px 10px;font-size:12px;max-width:260px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:5;opacity:0;transition:opacity 120ms}
.gx-tip.show{opacity:1}
.gx-multi{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:var(--surf);border:1px solid var(--acc);border-radius:var(--r2);padding:6px 8px 6px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;z-index:4}
.fl-item{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:13px;cursor:pointer}
.fl-item input{accent-color:var(--acc)}
.fl-item .n{margin-left:auto;color:var(--tx3);font-size:11.5px}
.ent-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r1);cursor:pointer;font-size:13px;width:100%;background:none;border:0;text-align:left}
.ent-row:hover{background:var(--elev)}
.insp-head{padding:16px 16px 12px;border-bottom:1px solid var(--bd2)}
.insp-title{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.conf{display:flex;align-items:center;gap:8px;font-size:12px}
.conf .bar{flex:1;height:4px;background:var(--elev);border-radius:2px;overflow:hidden}
.conf .bar i{display:block;height:100%}
.rel{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--r1);font-size:12.5px;cursor:pointer;border:1px solid transparent;width:100%;background:none;text-align:left}
.rel:hover{background:var(--elev)}
.rel .rt{font-size:10.5px;font-weight:600;color:var(--tx3);padding:1px 5px;border:1px solid var(--bd);border-radius:3px;white-space:nowrap}
.ev{border:1px solid var(--bd2);border-radius:var(--r2);padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--bg);transition:border-color var(--t);display:block;width:100%;text-align:left}
.ev:hover{border-color:var(--acc)}
.ev .quote{font-size:13.5px;line-height:1.5}
.ev-src{font-size:11.5px;color:var(--tx3);margin-top:6px;display:flex;align-items:center;gap:6px}
.hist{font-size:12px;color:var(--tx2);border-left:1px solid var(--bd);padding-left:10px;margin-left:4px}
.hist div{padding:3px 0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 20px;color:var(--tx2)}
.empty svg{width:34px;height:34px;color:var(--tx3)}
.empty h3{color:var(--tx)}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:var(--overlay);z-index:90;opacity:0;transition:opacity var(--t)}
.drawer-bg.show{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surf);border-left:1px solid var(--bd);z-index:91;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 240ms cubic-bezier(.2,.7,.2,1)}
.drawer.show{transform:none}
.drawer-h{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.drawer-b{padding:18px;overflow:auto;flex:1}
.docpara{font-family:var(--serif);font-size:15px;line-height:1.7;margin:0 0 14px;color:var(--tx2)}
.docpara.hit{color:var(--tx)}
.doc-sec{font-size:12px;color:var(--tx3);margin:18px 0 6px;font-weight:600}

/* modal */
.modal-bg{position:fixed;inset:0;background:var(--overlay);z-index:100;display:grid;place-items:center;padding:20px;animation:fade 150ms}
.modal{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r3);width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop 180ms cubic-bezier(.2,.7,.2,1)}
.modal.wide{width:min(820px,100%)}
.modal-h{padding:16px 18px 10px;display:flex;align-items:flex-start;gap:10px}
.modal-b{padding:6px 18px 16px;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--bd2);display:flex;justify-content:flex-end;gap:8px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}}
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:120}
.toast{background:var(--surf);border:1px solid var(--bd);border-left:3px solid var(--acc);border-radius:var(--r2);padding:10px 12px;min-width:260px;max-width:380px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:pop 200ms}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}

/* environments */
.focus3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.focus{border:1px solid var(--bd);border-radius:var(--r3);padding:18px;cursor:pointer;background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;transition:border-color var(--t),background var(--t)}
.focus:hover{border-color:var(--fc)}
.focus.on{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 9%,var(--bg))}
.focus .fi{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--fc) 16%,transparent);color:var(--fc)}
.focus .fi svg{width:20px;height:20px}
.focus .chkmark{position:absolute;top:14px;right:14px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bd)}
.focus.on .chkmark{background:var(--fc);border-color:var(--fc)}
.envlay{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
.vsteps{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.vsteps button{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r2);background:none;border:0;cursor:pointer;color:var(--tx2);font-size:13px;text-align:left}
.vsteps button b{width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);font-size:10.5px;display:grid;place-items:center;flex:none}
.vsteps button.on{background:var(--acc-soft);color:var(--tx)}
.vsteps button.on b{background:var(--acc);border-color:var(--acc);color:#fff}
.vsteps button.done b{border-color:var(--ok);color:var(--ok)}
.flow{position:relative;height:520px;background:var(--canvas);border:1px solid var(--bd);border-radius:var(--r3);overflow:auto;background-image:radial-gradient(color-mix(in srgb,var(--tx3) 35%,transparent) 1px,transparent 1px);background-size:20px 20px}
.flow-inner{position:relative;width:1400px;height:820px}
.flow svg.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fnode{position:absolute;width:184px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2);box-shadow:0 4px 14px rgba(0,0,0,.2);user-select:none;font-size:12.5px}
.fnode.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.fnode-h{padding:7px 9px;cursor:grab;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--bd2)}
.fnode-h:active{cursor:grabbing}
.fnode-b{padding:6px 9px 8px;color:var(--tx2);font-size:11.5px;display:flex;flex-direction:column;gap:3px}
.handle{position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--surf);border:2px solid var(--acc);cursor:crosshair}
.handle:hover{background:var(--acc)}
.inflbar{height:3px;background:var(--elev);border-radius:2px;overflow:hidden}
.inflbar i{display:block;height:100%;background:var(--acc)}
.personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.persona{border:1px solid var(--bd);border-radius:var(--r3);background:var(--surf);display:flex;flex-direction:column}
.persona-h{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--bd2)}
.persona-b{padding:10px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:7px;flex:1}
.persona-b dt{color:var(--tx3);font-size:11.5px}
.persona-b dd{margin:0 0 2px}
.persona-f{padding:8px 10px;border-top:1px solid var(--bd2);display:flex;gap:6px;align-items:center}
.ring{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--acc);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--acc);flex:none}

/* simulation */
.simtop{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-bottom:1px solid var(--bd);background:var(--surf)}
.simtop>div{padding:10px 14px;border-right:1px solid var(--bd2)}
.simtop .v{font-size:17px;font-weight:600}
.simtop .l{font-size:11.5px;color:var(--tx2)}
.simgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 300px;grid-template-rows:minmax(340px,1fr) auto;gap:12px;padding:12px}
.simgraph{position:relative;height:100%;min-height:340px;background:var(--canvas);border-radius:var(--r3);border:1px solid var(--bd);overflow:hidden}
.simgraph canvas{width:100%;height:100%;display:block}
.feed{display:flex;flex-direction:column;min-height:0;height:100%;max-height:560px}
.feed-list{overflow-y:auto;flex:1;padding:6px 10px}
.post{padding:10px 4px;border-bottom:1px solid var(--bd2);display:grid;grid-template-columns:30px 1fr;gap:9px;animation:arrive 280ms}
.post .avatar{width:30px;height:30px;font-size:10.5px;border:1.5px dashed rgba(255,255,255,.7)}
.post-h{display:flex;gap:6px;align-items:baseline;font-size:12.5px}
.post-t{font-size:13px;margin-top:2px;line-height:1.45}
.post-m{display:flex;gap:12px;font-size:11.5px;color:var(--tx3);margin-top:5px}
.thread{border:1px solid var(--bd2);border-radius:var(--r2);margin:8px 0;padding:10px;background:var(--bg);animation:arrive 280ms}
.thread .reply{margin-left:14px;padding-left:10px;border-left:2px solid var(--bd);margin-top:8px;font-size:12.5px}
.vote{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--tx3);width:24px}
@keyframes arrive{from{opacity:0;transform:translateY(-4px);background:var(--acc-soft)}}
.tlbar{grid-column:1/-1;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r3);padding:10px 14px;display:flex;align-items:center;gap:12px}
.scrub{position:relative;flex:1;height:34px}
.scrub-track{position:absolute;left:0;right:0;top:15px;height:4px;background:var(--elev);border-radius:2px}
.scrub-fill{position:absolute;left:0;top:15px;height:4px;background:var(--acc);border-radius:2px}
.scrub-mk{position:absolute;top:6px;width:2px;height:22px;background:var(--warn);border-radius:1px;cursor:pointer}
.scrub-mk::after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;background:var(--warn);transform:rotate(45deg)}
.scrub input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;margin:0}
.scrub-head{position:absolute;top:9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surf);border:2px solid var(--acc);pointer-events:none;transition:left 200ms}
.charts{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.chart{padding:12px 14px}
.chart svg{width:100%;height:auto;display:block}
.agent-row{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--bd2);font-size:12.5px;cursor:pointer}
.agent-row:hover{background:var(--elev)}
.agent-row .avatar{width:26px;height:26px;font-size:10px;border:1.5px dashed rgba(255,255,255,.7)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.pulse.on{box-shadow:0 0 0 0 var(--ok);animation:pul 1.4s infinite}
@keyframes pul{70%{box-shadow:0 0 0 6px transparent}}
.ivt{position:relative;height:56px;border:1px solid var(--bd);border-radius:var(--r2);background:var(--bg);margin-top:8px}
.ivt .tick{position:absolute;bottom:0;width:1px;height:6px;background:var(--bd)}
.ivt .tick span{position:absolute;bottom:8px;left:-8px;font-size:10px;color:var(--tx3);width:16px;text-align:center}
.ivt .iv{position:absolute;top:8px;transform:translateX(-50%);background:var(--warn-s);color:var(--warn);border:1px solid var(--warn);font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap;cursor:pointer}

/* reports */
.rep{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;height:100%;min-height:0}
.rep>div{overflow-y:auto;min-height:0}
.rep-left{border-right:1px solid var(--bd);background:var(--surf)}
.rep-right{border-left:1px solid var(--bd);background:var(--surf)}
.rep-doc{max-width:760px;margin:0 auto;padding:36px 40px 80px}
.rep-doc h1{font-size:26px;line-height:1.2;margin-bottom:6px}
.rep-doc h2{font-size:18px;margin:30px 0 8px;padding-top:12px;border-top:1px solid var(--bd2)}
.rep-doc .body{font-family:var(--serif);font-size:15.5px;line-height:1.68}
.rep-doc [contenteditable=true]{outline:1px dashed var(--acc);outline-offset:4px;border-radius:2px}
.outline a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r1);color:var(--tx2);font-size:13px}
.outline a:hover{background:var(--elev);color:var(--tx)}

/* chat */
.chat{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;height:100%;min-height:0}
.chat>div{min-height:0}
.chat-left,.chat-right{background:var(--surf);overflow-y:auto}
.chat-left{border-right:1px solid var(--bd)}.chat-right{border-left:1px solid var(--bd)}
.chat-mid{display:flex;flex-direction:column}
.msgs{flex:1;overflow-y:auto;padding:24px 0}
.msgs-in{max-width:760px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:18px}
.msg{display:grid;grid-template-columns:30px 1fr;gap:12px}
.msg .avatar{width:30px;height:30px}
.msg-b{font-size:14px;line-height:1.6;min-width:0}
.msg-b table{border-collapse:collapse;margin:8px 0;font-size:12.5px;width:100%}
.msg-b td,.msg-b th{border:1px solid var(--bd);padding:5px 8px;text-align:left}
.msg-b ul{margin:6px 0;padding-left:20px}
.msg.user .msg-b{background:var(--elev);padding:10px 14px;border-radius:var(--r3);justify-self:start}
.msg-tools{display:flex;gap:4px;margin-top:6px;opacity:.7}
.typing{display:inline-flex;gap:3px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.composer{border-top:1px solid var(--bd);padding:12px 24px 16px}
.composer-in{max-width:760px;margin:0 auto}
.composer textarea{width:100%;resize:none;min-height:48px;max-height:160px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r3);padding:12px 50px 12px 14px;line-height:1.45}
.composer textarea:focus{outline:none;border-color:var(--acc)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugg button{border:1px solid var(--bd);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--tx2)}
.sugg button:hover{border-color:var(--acc);color:var(--tx)}
.conv-item{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:var(--r2);cursor:pointer}
.conv-item:hover{background:var(--elev)}
.conv-item.on{background:var(--acc-soft)}

/* admin */
.perm-grid td{text-align:center}
.perm-grid td:first-child{text-align:left}
.quota{display:grid;grid-template-columns:140px 1fr 120px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd2);font-size:13px}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{position:relative;overflow:hidden;background:var(--side);border-right:1px solid var(--bd)}
.login-art canvas{position:absolute;inset:0;width:100%;height:100%}
.login-copy{position:absolute;left:48px;bottom:48px;right:48px;max-width:460px}
.login-copy h1{font-size:34px;line-height:1.1;letter-spacing:-.025em;font-weight:600}
.login-form{display:grid;place-items:center;padding:40px}
.login-form form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.acct{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--bd);border-radius:var(--r2);cursor:pointer;background:var(--surf);text-align:left;width:100%}
.acct:hover{border-color:var(--acc)}

/* responsive */
.mobtabs{display:none}
@media (max-width:1280px){
  .strip{grid-template-columns:repeat(5,1fr)}.strip>div:nth-child(5){border-right:0}.strip>div:nth-child(-n+5){border-bottom:1px solid var(--bd2)}
  .gx{grid-template-columns:240px minmax(0,1fr) 300px}
  .simgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.simgrid .agentmon{grid-column:1/-1}
  .charts{grid-template-columns:repeat(2,1fr)}
  .rep{grid-template-columns:220px minmax(0,1fr)}.rep-right{display:none}
  .chat{grid-template-columns:240px minmax(0,1fr)}.chat-right{display:none}
}
@media (max-width:1024px){
  .shell{grid-template-columns:60px 1fr}
  .shell .brand-text,.shell .ws-text,.shell .nav-sec,.shell .nav a span,.shell .nav .count,.shell .me-text{display:none}
  .shell .side-tools{flex-direction:column}
  .dash{grid-template-columns:1fr}
  .gx{grid-template-columns:minmax(0,1fr)}
  .gx-left,.gx-right{display:none}
  .gx.tab-left .gx-left,.gx.tab-right .gx-right{display:block;position:absolute;top:44px;bottom:0;width:min(340px,90vw);z-index:6;box-shadow:0 20px 50px rgba(0,0,0,.4)}
  .gx.tab-left .gx-left{left:0}.gx.tab-right .gx-right{right:0}
  .gx-wrap{position:relative}
  .mobtabs{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--surf)}
  .envlay{grid-template-columns:1fr}.vsteps{flex-direction:row;overflow-x:auto;position:static}
  .simtop{grid-template-columns:repeat(4,1fr)}
  .pick{grid-template-columns:repeat(2,1fr)}
  .stages{grid-template-columns:140px repeat(5,1fr)}
  .login{grid-template-columns:1fr}.login-art{display:none}
}
@media (max-width:720px){
  .shell,.shell.collapsed{grid-template-columns:1fr;grid-template-rows:1fr 56px}
  .side{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--bd)}
  .side .brand,.side .ws,.side-foot,.nav-sec{display:none}
  .nav{flex-direction:row;padding:4px;overflow-x:auto;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;padding:6px 8px}
  .nav a.on::before{display:none}
  .main{order:1}
  .top{padding:0 12px}.crumbs{display:none}.search{max-width:none}
  .page{padding:16px}
  .strip{grid-template-columns:repeat(3,1fr)}
  .grid2,.grid3,.focus3,.qa{grid-template-columns:1fr}
  .tbl .hm{display:none}
  .rep{grid-template-columns:1fr}.rep-left{display:none}.rep-doc{padding:20px}
  .chat{grid-template-columns:1fr}.chat-left{display:none}
  .simgrid{grid-template-columns:1fr}.charts{grid-template-columns:1fr}.simtop{grid-template-columns:repeat(2,1fr)}
  .stages{display:none}
  .pick{grid-template-columns:1fr}
}

function buildGraph(N, E, prefix) {
  const nodes = N.map(([id,type,name,desc,aliases,attrs]) => ({id,type,name,desc,aliases,attrs,conf:0, status:"pending", docs:[], history:[{at:daysAgo(10),by:"Extraction (demo)",what:"Extracted from sources"}]}));
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const edges = E.map(([s,t,o,conf,status,ev,flag], i) => ({id:`${prefix}e${i+1}`, s, o, type:t, conf, status: flag === "conflict" ? "conflict" : status, flag:flag||null, directed:true,
    ev: ev.map(([doc,p,si]) => ({doc,p,si})), validFrom:null, validTo:null, history:[{at:daysAgo(10),by:"Extraction (demo)",what:"Extracted"}]}));
  edges.forEach(e => { [e.s, e.o].forEach(id => { const n = byId[id]; if (!n) return; e.ev.forEach(v => { if (!n.docs.includes(v.doc)) n.docs.push(v.doc); }); n.conf = Math.max(n.conf, e.conf); }); });
  nodes.forEach(n => {
    const es = edges.filter(e => e.s === n.id || e.o === n.id);
    n.status = es.length && es.filter(e => e.status === "approved").length >= Math.ceil(es.length / 2) ? "approved" : "pending";
    if (!n.conf) n.conf = .6;
    n.conf = Math.round(n.conf * 100) / 100;
  });
  if (byId.o_vbc2) { byId.o_vbc2.dupOf = "o_vbc"; byId.o_vbc2.status = "pending"; }
  return { nodes, edges };
}

const VIEWS = {}, MOUNT = {}, UNMOUNT = {};
// Routing works without the URL: some previews (sandboxed iframes, file viewers) block hash navigation.
let SKIP_HASH = false;
const readHash = () => { try { return (location.hash || "").slice(1); } catch (e) { return ""; } };
// In sandboxed or embedded previews, changing the hash can reload the whole page and drop the session, so the URL is only updated in a normal top-level tab.
const HASH_OK = (() => { try { return window.self === window.top && window.origin !== "null" && location.protocol !== "about:"; } catch (e) { return false; } })();
function writeHash(r) { if (!HASH_OK) return; try { if (readHash() !== r) { SKIP_HASH = true; history.replaceState(null, "", "#" + r); SKIP_HASH = false; } } catch (e) { SKIP_HASH = false; } }
function routeTo(r) { navigate(r); }
function onHash() { if (SKIP_HASH) { SKIP_HASH = false; return; } navigate(readHash() || "dashboard", false); }
function navigate(r, push = true) {
  r = r || "dashboard";
  if (!session) { renderLogin(); return; }
  if (!VIEWS[r] || r === "login") r = "dashboard";
  if (r === "admin" && !can("admin.access")) { toast("Administration requires the Administrator role", "warn"); r = "dashboard"; }
  if (push) writeHash(r);

}

function buildReport(cfg) {

        B("interp", `Within this synthetic scenario, discussion concentrated on ${topT[0]?.[0].toLowerCase()} and ${topT[1]?.[0].toLowerCase() || "related issues"}. This describes the behaviour of modelled actors under stated assumptions; it is not a forecast of real-world behaviour.`)] : [B("interp", "No simulation run was selected, so this report covers the evidence graph only.")])],

  modal({ title:isNew ? "Add intervention" : "Edit intervention", sub:"A hypothetical event injected into the synthetic world.", ok:isNew ? "Add" : "Save", body:`<div class="grid2"><div class="field"><label>Round</label><input class="inp" type="number" name="round" min="1" max="${f.rounds}" value="${v.round}"></div><div class="field"><label>Topic affected</label><select class="sel" name="topic">${topics.map(t => `<option ${v.topic === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>
    <div class="field" style="grid-column:1/-1"><label>What happens</label><input class="inp" name="label" value="${esc(v.label)}" placeholder="e.g. Commission circulates a joint monitoring offer"></div><div class="field" style="grid-column:1/-1"><label>Stance shift on topic (−0.5 to +0.5)</label><input type="range" name="shift" min="-50" max="50" value="${v.shift * 100}"></div>
    ${!isNew ? `<label class="chk"><input type="checkbox" name="remove">Remove intervention</label>` : ""}</div>`,
    onOk:(fd, fm) => { if (fd.remove) { f.interventions = f.interventions.filter(x => x !== v); renderView(); return; } const r = +fd.round; if (!(r >= 1 && r <= f.rounds)) return fieldErr(fm, "round", `Round must be between 1 and ${f.rounds}`); if (fd.label.trim().length < 4) return fieldErr(fm, "label", "Describe the event");
      Object.assign(v, { round:r, topic:fd.topic, label:fd.label.trim(), shift:fd.shift / 100 }); if (isNew) f.interventions.push({ id:uid("iv"), ...v }); renderView(); } });
}
function commitRepEdits() { const r = curRep(); if (!r) return; $$("[data-edit]", $("#repDoc")).forEach(el => { const k = el.dataset.edit, t = el.textContent.trim(); if (k === "title") { if (t) r.title = t; return; } const [si, bi] = k.split(".").map(Number); if (r.sections[si]?.blocks[bi] && t) r.sections[si].blocks[bi].text = t; }); r.updated = now(); save(); }
function ingestFiles(list, target, redraw) {
  [...list].forEach(file => { const ext = file.name.split(".").pop().toLowerCase(); const type = ext === "pdf" ? "PDF" : ext === "md" || ext === "markdown" ? "Markdown" : ext === "txt" ? "TXT" : null;
    const f = { id:uid("f"), name:file.name, type:type || ext.toUpperCase(), size:file.size, progress:0 };
    if (!type) f.error = "Unsupported type — use PDF, Markdown or TXT"; else if (file.size > S.settings.maxUploadMB * 1048576) f.error = `Larger than ${S.settings.maxUploadMB} MB limit`; else if (!file.size) f.error = "File is empty";
    target.push(f); if (f.error) return redraw();
    if (type === "PDF") FILES.set(f.id, URL.createObjectURL(file)); else { const rd = new FileReader(); rd.onload = () => { f.text = String(rd.result); }; rd.onerror = () => { f.error = "Could not read file"; redraw(); }; rd.readAsText(file); }
    const t = setInterval(() => { f.progress = Math.min(100, f.progress + 18 + Math.random() * 25); if (f.progress >= 100 && (type === "PDF" || f.text != null || f.error)) { f.progress = 100; clearInterval(t); } redraw(); }, RM ? 30 : 160); });
  redraw();
}
function dropify(el, cb) { ["dragenter","dragover"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add("over"); })); ["dragleave","drop"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove("over"); }));
  el.addEventListener("drop", e => cb(e.dataTransfer.files)); }

/* =========================================================================
   Input handlers — data-on="name"
   ========================================================================= */
const H = {

  gxConf1:el => { U.gFilter.conf[1] = Math.max(el.value / 100, U.gFilter.conf[0]); gxRefresh(); },
  gxStatus:el => { el.checked ? U.gFilter.status.add(el.value) : U.gFilter.status.delete(el.value); gxRefresh(); },
  gxDoc:el => { el.checked ? U.gFilter.docs.add(el.value) : U.gFilter.docs.delete(el.value); gxRefresh(); },

  // environments

    if (e.name === "Untitled environment") e.name = `${nodeIn(av, el.value)?.name} — ${FOCUS[e.focus].label.toLowerCase()} focus`; save(); return true; },
  envField:el => { curEnv()[el.dataset.k] = el.value; save(); },
  envTopics:el => { curEnv().topics = el.value.split(",").map(x => x.trim()).filter(Boolean); save(); },
  envActor:el => { const e = curEnv(); el.checked ? e.actorIds.push(el.value) : e.actorIds = e.actorIds.filter(x => x !== el.value); save(); return true; },
  envRule:el => { curEnv().rules[+el.dataset.i] = el.value; save(); },
  envChan:el => { curEnv().channels[el.value] = el.checked; save(); return true; },
  envTiming:el => { const t = curEnv().timing; t[el.dataset.k] = el.type === "number" ? +el.value : el.value; save(); },
  flowP:el => { const e = curEnv(), p = e.personas.find(x => x.id === el.dataset.id); const k = el.dataset.k; p[k] = el.type === "range" ? el.value / 100 : el.value; save(); el.previousElementSibling && el.type === "range" && (el.previousElementSibling.textContent = `${k[0].toUpperCase() + k.slice(1)} ${pct(p[k])}`); FLOW?.render(); },
  flowStance:el => { const p = curEnv().personas.find(x => x.id === el.dataset.id); p.stance[el.dataset.t] = el.value / 100; el.parentElement.querySelector(".dim").textContent = (el.value / 100).toFixed(1); save(); },
  // simulations
  cfg:(el, type) => { const f = U.simCfg; const k = el.dataset.k; f[k] = el.type === "number" ? +el.value : el.value;
    if (k === "envId") { const env = S.envs.find(e => e.id === el.value); if (env) Object.assign(f, { agents:env.personas.length, rounds:env.timing.rounds, timeStep:env.timing.timeStep, tokenBudget:env.timing.tokenBudget, channels:{ ...env.channels }, objective:env.objective }); }
    return type === "change"; },
  cfgChan:el => { U.simCfg.channels[el.value] = el.checked; return true; },
  cmpPick:el => { if (el.checked) { U.compare.push(el.value); if (U.compare.length > 2) U.compare.shift(); } else U.compare = U.compare.filter(x => x !== el.value); return true; },
  feedF:el => { U.feedFilter[el.dataset.k] = el.value; lvUpdate(); },
  lvScrub:el => { lvStop(); U.play.round = +el.value; lvUpdate(); },
  lvSpeed:el => { U.play.speed = +el.value; if (U.play.timer) lvPlay(true); },
  // reports & chat
  repVer:el => { const r = curRep(), v = r.versions.find(x => x.n === +el.value); if (!v || v === r.versions.at(-1)) return; confirmDlg(`Restore v${v.n}?`, "The report text returns to this version. The current text stays available as the latest version in history.", "Restore", () => { r.sections = deep(v.sections); r.versions.push({ n:r.versions.length + 1, at:now(), by:me().name, note:`Restored v${v.n}`, sections:deep(v.sections) }); save(); renderView(); }); },
  chatKey:(el, type, ev) => { el.style.height = "auto"; el.style.height = Math.min(160, el.scrollHeight) + "px"; },
  convRun:el => { const c = curConv(); c.runId = el.value; if (c.mode === "agent") { const run = S.runs.find(r => r.id === c.runId); c.agentId = S.envs.find(e => e.id === run.envId)?.personas[0]?.id; } save(); return true; },
  convAgent:el => { const c = curConv(); c.agentId = el.value; const run = S.runs.find(r => r.id === c.runId); c.title = `Chat with ${S.envs.find(e => e.id === run.envId).personas.find(p => p.id === el.value).name}`; save(); return true; },

  userRole:el => { const u = S.users.find(x => x.id === el.dataset.id); u.role = el.value; audit("user.update", `${u.name} → ${u.role}`); save(); toast(`${u.name} is now ${u.role}`, "ok"); },
  perm:el => { const r = S.roles[el.dataset.role]; el.checked ? r.push(el.value) : S.roles[el.dataset.role] = r.filter(p => p !== el.value); audit("role.update", `${el.dataset.role}: ${el.checked ? "+" : "−"}${el.value}`); save(); },
  modelF:el => { const m = S.models.find(x => x.id === el.dataset.id); m[el.dataset.k] = el.type === "number" ? +el.value : el.value; save(); },
  setF:(el, type) => { S.settings[el.dataset.k] = +el.value; if (type === "change") { audit("settings.update", `${el.dataset.k} = ${el.value}`); toast("Setting saved", "ok"); } save(); },
  setB:el => { S.settings[el.dataset.k] = el.checked; audit("settings.update", `${el.dataset.k} = ${el.checked}`); save(); toast("Setting saved", "ok"); },
  quota:(el, type) => { S.quotas[el.dataset.role] = +el.value; save(); return type === "change"; },

const TEXT_LIVE = new Set(["dashFilter","caseQ","userQ","auditQ","convQ"]);
function handleInput(ev) {
  const el = ev.target.closest("[data-on]"); if (!el) return; const name = el.dataset.on, h = H[name]; if (!h) return;
  const isText = el.matches("input[type=text],input:not([type]),input[type=search],input[type=email],input[type=number],textarea");
  if (ev.type === "change" && isText && !["cfg","setF","quota"].includes(name)) return;
  if (ev.type === "input" && !isText && el.type !== "range") return;
  if (el.type === "range" && ev.type === "change" && !name.startsWith("gxConf")) return;
  if (name.startsWith("gxConf") && ev.type === "input") { const lab = el.closest(".sec")?.querySelector(".sec-t .dim"); if (lab) { const v = +el.value / 100; lab.textContent = name === "gxConf0" ? `${pct(v)} – ${pct(U.gFilter.conf[1])}` : `${pct(U.gFilter.conf[0])} – ${pct(v)}`; } return; }
  const rerender = h(el, ev.type, ev);
  if (rerender) { const key = { on:name, k:el.dataset.k, pos:el.selectionStart }; renderView();
    if (TEXT_LIVE.has(name)) { const n = $(`[data-on="${key.on}"]`); if (n) { n.focus(); try { n.setSelectionRange(key.pos, key.pos); } catch (e) {} } } }
}
document.addEventListener("input", handleInput); document.addEventListener("change", handleInput);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!e.target.closest("#notifdrop") && !e.target.closest("[data-act=notif]") && U.notif) { U.notif = false; const d = $("#notifdrop"); if (d) d.innerHTML = ""; }
  if (!e.target.closest(".search")) { const r = $("#gsres"); if (r) r.innerHTML = ""; }
  if (!el) { const a = e.target.closest('a[href^="#"]'); if (a && a.getAttribute("href").length > 1) { e.preventDefault(); navigate(a.getAttribute("href").slice(1)); } return; }
  if (el.disabled) return; const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === "A") e.preventDefault(); fn(el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && !e.target.matches("input,textarea,select,[contenteditable]")) { const s = $("#gsearch"); if (s) { e.preventDefault(); s.focus(); } }
  if (e.target.id === "chatIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); A.sendMsg(); }
  if (e.target.id === "gsearch") { const items = $$("#gsres .drop-item"); if (!items.length) return; let i = items.findIndex(x => x.classList.contains("kb"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); items[i]?.classList.remove("kb"); i = clamp(i + (e.key === "ArrowDown" ? 1 : -1), 0, items.length - 1); items[i].classList.add("kb"); }
    if (e.key === "Enter") { e.preventDefault(); (items[i] || items[0]).click(); } if (e.key === "Escape") { $("#gsres").innerHTML = ""; e.target.blur(); } }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".dz[data-act]")) { e.preventDefault(); A.pickFiles(null, e); }
});

["dragenter","dragover"].forEach(t => document.addEventListener(t, e => { const dz = e.target.closest?.("#dz"); if (dz) { e.preventDefault(); dz.classList.add("over"); } }));
["dragleave","drop"].forEach(t => document.addEventListener(t, e => { const dz = e.target.closest?.("#dz"); if (dz) { e.preventDefault(); dz.classList.remove("over"); if (t === "drop") ingestFiles(e.dataTransfer.files, wz().files, () => { if (U.route === "create") renderView(); }); } }));

/* ---------------- global search ---------------- */
function globalSearch(q) {
  const box = $("#gsres"); if (!box) return; q = q.trim().toLowerCase(); if (q.length < 2) { box.innerHTML = ""; return; }
  const res = [];
  S.cases.forEach(c => { if ((c.title + " " + c.tags.join(" ")).toLowerCase().includes(q)) res.push({ k:"Case", t:c.title, s:c.status, act:`data-act="openCase" data-id="${c.id}"`, icon:ic("folder",'width="15" height="15"') }); });
  Object.entries(S.graphs).forEach(([cid, g]) => { const v = g.versions.find(x => x.id === g.current); v.nodes.filter(n => (n.name + " " + n.aliases.join(" ")).toLowerCase().includes(q)).slice(0, 6).forEach(n => res.push({ k:ETYPES[n.type].label, t:n.name, s:S.cases.find(c => c.id === cid)?.title, act:`data-act="searchNode" data-case="${cid}" data-id="${n.id}"`, icon:shapeSvg(n.type, 13) })); });
  S.docs.filter(d => d.name.toLowerCase().includes(q) || d.paras.some(p => p.s.some(s => s.toLowerCase().includes(q)))).slice(0, 5).forEach(d => res.push({ k:"Source", t:d.name, s:S.cases.find(c => c.id === d.caseId)?.title, act:`data-act="searchDoc" data-id="${d.id}"`, icon:ic("file",'width="15" height="15"') }));
  S.runs.filter(r => r.name.toLowerCase().includes(q)).forEach(r => res.push({ k:"Run", t:r.name, s:r.status, act:`data-act="openRun" data-id="${r.id}"`, icon:ic("play",'width="15" height="15"') }));
  S.reports.filter(r => r.title.toLowerCase().includes(q)).forEach(r => res.push({ k:"Report", t:r.title, s:r.status, act:`data-act="openReport" data-id="${r.id}"`, icon:ic("file",'width="15" height="15"') }));
  box.innerHTML = `<div class="drop" role="listbox">${res.slice(0, 14).map(r => `<button class="drop-item" ${r.act} role="option"><span style="margin-top:2px;color:var(--tx3)">${r.icon}</span><div style="min-width:0"><div class="small trunc">${esc(r.t)}</div><div class="xs dim trunc">${r.k}${r.s ? " · " + esc(r.s) : ""}</div></div></button>`).join("") || `<p class="small muted" style="padding:10px">No results for “${esc(q)}”.</p>`}</div>`;
}
A.searchNode = el => { $("#gsres").innerHTML = ""; $("#gsearch").value = ""; if (S.caseId !== el.dataset.case) { S.caseId = el.dataset.case; resetCaseCtx(); } U.sel = el.dataset.id; U.selEdge = null; U.gFocus = null; const n = nodeIn(gver(), U.sel); if (n) U.gFilter.types.add(n.type);
  if (U.route === "graph") { renderView(); setTimeout(() => GX?.focusOn(U.sel), 300); } else { routeTo("graph"); setTimeout(() => GX?.focusOn(U.sel), 900); } };
A.searchDoc = el => { $("#gsres").innerHTML = ""; const d = docById(el.dataset.id); if (S.caseId !== d.caseId) { S.caseId = d.caseId; resetCaseCtx(); } routeTo("documents"); setTimeout(() => previewDoc(d.id), 100); };
